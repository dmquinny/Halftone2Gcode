name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Halftone Converter __VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeRelease: true

      - name: Check and upload portable executable (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          if [ -f "src-tauri/target/release/halftone-converter.exe" ]; then
            echo "Found portable executable"
            ls -lh src-tauri/target/release/halftone-converter.exe
          else
            echo "Portable executable not found!"
            ls -la src-tauri/target/release/
          fi
        shell: bash

      - name: Upload Windows portable
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
          asset_path: src-tauri/target/release/halftone-converter.exe
          asset_name: halftone-converter.exe
          asset_content_type: application/octet-stream

      - name: Check and upload portable executable (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          if [ -f "src-tauri/target/release/halftone-converter" ]; then
            echo "Found portable executable"
            ls -lh src-tauri/target/release/halftone-converter
          else
            echo "Portable executable not found!"
            ls -la src-tauri/target/release/
          fi

      - name: Upload macOS portable
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
          asset_path: src-tauri/target/release/halftone-converter
          asset_name: halftone-converter-macos
          asset_content_type: application/octet-stream

      - name: Check and upload portable executable (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          if [ -f "src-tauri/target/release/halftone-converter" ]; then
            echo "Found portable executable"
            ls -lh src-tauri/target/release/halftone-converter
          else
            echo "Portable executable not found!"
            ls -la src-tauri/target/release/
          fi

      - name: Upload Linux portable
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
          asset_path: src-tauri/target/release/halftone-converter
          asset_name: halftone-converter-linux
          asset_content_type: application/octet-stream
